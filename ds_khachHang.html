<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách khách hàng</title>
    <link rel="stylesheet" href="ds_khachHang.css">
</head>
<body>
    <div id="kh-wrapper">
        <!-- Phần trái: Bảng danh sách khách hàng -->
        <div id="kh-left">
            <h1 class="kh-title">Danh sách khách hàng</h1>

            <!-- Bảng khách hàng -->
            <div class="kh-table-container">
                <table class="kh-table">
                    <thead>
                        <tr>
                            <th>Họ tên</th>
                            <th>Tên đăng nhập</th>
                            <th>Mật khẩu</th>
                            <th>Ngày đăng ký</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Nguyễn Văn A</td>
                            <td>nguyenvana</td>
                            <td>******</td>
                            <td>2021-10-01</td>
                            <td>
                                <button class="kh-del">X</button>
                                <button class="kh-edit">Sửa</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Trần Thị B</td>
                            <td>tranthib</td>
                            <td>******</td>
                            <td>2021-10-05</td>
                            <td>
                                <button class="kh-del">X</button>
                                <button class="kh-edit">Sửa</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Phần phải: Tìm kiếm khách hàng -->
        <div id="kh-right">
            <div class="kh-search-box">
                <h2 class="kh-subtitle">Tìm kiếm khách hàng</h2>
                <form class="kh-search-form">
                    <input type="text" placeholder="Tên khách hàng">
                    <input type="text" placeholder="Tên đăng nhập">
                    <button type="submit">Tìm</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>

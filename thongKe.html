<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống kê</title>
    <link rel="stylesheet" href="thongKe.css">
</head>
<body>
    <div class="stats-wrapper">
        <!-- Phần chính giữa: Bảng thống kê -->
        <div class="stats-left-panel">
            <h1 class="stats-title">Thống kê</h1>

            <!-- Bảng thống kê -->
            <div class="stats-table-container">
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Mặt hàng</th>
                            <th>Số lượng</th>
                            <th>Tổng</th>
                            <th>Chi tiết</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Sản phẩm A</td>
                            <td>150</td>
                            <td>1,500,000 VND</td>
                            <td><button>Chi tiết</button></td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Sản phẩm B</td>
                            <td>50</td>
                            <td>500,000 VND</td>
                            <td><button>Chi tiết</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Phần bên phải: Tùy chỉnh lọc và kết quả mẫu -->
        <div class="stats-right-panel">
            <!-- Tùy chỉnh lọc -->
            <div class="stats-filter-section">
                <h3 class="stats-subtitle">Tùy chỉnh lọc</h3>
                <form class="stats-filter-form">
                <label for="filter-product">Lọc theo sản phẩm:</label>
                <select id="filter-product">
                    <option value="all">Tất cả sản phẩm</option>
                    <option value="best">Mặt hàng bán chạy nhất</option>
                    <option value="worst">Mặt hàng bán ít nhất</option>
                </select>

                <label for="filter-time">Thời gian:</label>
                <select id="filter-time">
                    <option value="all">Tất cả thời gian</option>
                    <option value="week">Tuần này</option>
                    <option value="month">Tháng này</option>
                </select>

                <label for="revenue">Tổng thu:</label>
                <input type="number" id="revenue" placeholder="Nhập số thu">

                <button type="submit">Đặt</button>
            </form>
            </div>

            <!-- Kết quả thống kê mẫu -->
            <div class="stats-result">
                <h3 class="stats-subtitle">Kết quả (mẫu)</h3>
                <p><strong>Mặt hàng bán chạy nhất:</strong> Sản phẩm A</p>
                <p><strong>Mặt hàng bán ít nhất:</strong> Sản phẩm B</p>
                <p><strong>Tổng doanh thu:</strong> 10,000,000 VND</p>
            </div>
        </div>
    </div>
</body>
</html>

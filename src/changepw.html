<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../asset/icon/fontawesome-free-7.1.0-web/css/all.min.css">
  <link rel="stylesheet" href="CSS/changepw.css">
</head>

<body>
  <header class="top-bar header">
    <div class="hlkas">
      <a href="#home" class="logo">Logo</a>
      <span class="text">Xác minh tài khoảng</span>
    </div>

    <a href="https://www.facebook.com/minhbibenhdeptrai6969" class="text" id="link-help">Bạn cần giúp đỡ?</a>
  </header>
  <main class="change-container">
    <!-- TRANG 1: Đang xác minh (hiển thị 3 giây) -->
    <div class="verifying-page active">
      <div class="changepw-content">
        <div class="icon-loading-container">
          <!-- Viền xoay 1 -->
          <div class="loading-ring"></div>
      
          <!-- Icon shield cố định -->
          <div class="icon icon-loading">
            <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3l-8 3v7c0 6 8 10 8 10z" />
              <path d="m9 12l2 2l4-4" />
            </svg>
          </div>
        </div>

        <div class="text">
          <h2>Tài khoản của bạn đang được xác minh...</h2>
        </div>
      </div>
    </div>

    <!-- TRANG 2: Xác minh bằng email (hiển thị sau 3 giây) -->
    <div class="changepw-box email-verify-page">
      <div class="changepw-content">
        <div class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3l-8 3v7c0 6 8 10 8 10z" />
            <path d="m9 12l2 2l4-4" />
          </svg>
        </div>

        <div class="text">
          <h2>Để tăng cường bảo mật cho tài khoản của bạn,
            hãy xác minh thông tin bằng một trong những cách sau.</h2>
        </div>

        <div class="button">
          <button id="button"><i class="fa-regular fa-envelope"></i>
            <span>Xác minh bằng liên kết Email</span></button>
        </div>
      </div>
    </div>
  </main>


  <footer class="footer">
    <div class="footer-logo">Logo</div>
    <p>Copyrighted 2025 by iciii</p>
    <div class="socials">
      <i class="fa-brands fa-github"></i>
      <i class="fa-brands fa-facebook"></i>
      <i class="fa-brands fa-youtube"></i>
    </div>
  </footer>
  <script>
    // Tự động chuyển từ trang đang xác minh sang trang xác minh email sau 3 giây
    setTimeout(function () {
      document.querySelector('.verifying-page').classList.remove('active');
      document.querySelector('.email-verify-page').classList.add('active');
    }, 3000);
  </script>
</body>

</html>

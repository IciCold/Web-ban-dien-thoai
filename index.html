<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giao diện Admin</title>
  <link rel="stylesheet" href="thongKe.css">
  <link rel="stylesheet" href="ds_sanPham.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex; 
      height: 100vh;
    }

    /* Cột bên trái */
    .sidebar {
      width: 120px;
      background-color: #97a9ff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 100%;
      height: 96px;
      background-color: #d9d9d9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      user-select: none;
    }

    .menu {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      padding-top: 30px;
      gap: 30px;
    }

    .icon-btn {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:hover {
      background-color: #eee;
    }

    /* Phần nội dung chính */
    .main {
      flex: 1;
      padding: 30px;
      position: relative;
    }

    .login {
      position: absolute;
      top: 20px;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      user-select: none;
    }

    .login:hover {
      border: 2px solid #000;
      border-radius: 10px;    
      padding: 5px 10px;      
      background-color: #f2f2f2; 
      transition: 0.2s; 
    }

    .avatar {
      width: 35px;
      height: 35px;
      background: black;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 20px;
      color: #444;
    }
    .icon-btn.active {
    background-color: #4e73df;
    color: white;
}
  </style>
</head>
